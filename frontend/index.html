<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTrotter - Premium Login</title>

    <!-- 3. Header & Branding: Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* 1. Background */
        body {
            /* Full-screen sunset over a mountain lake from Unsplash */
            background: url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 2. The Main Glass Panel */
        .glass-panel {
            /* Semi-transparent white gradient */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.35) 100%);

            /* Heavy frosted glass look */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            /* Crucial glossy edges: 3D border effect */
            border-top: 2px solid rgba(255, 255, 255, 0.8);
            border-left: 2px solid rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            border-right: 2px solid rgba(255, 255, 255, 0.3);

            /* Round corners significantly */
            border-radius: 32px;

            /* Strong outer drop shadow and subtle white inner glow */
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.5);

            width: 100%;
            max-width: 480px;
            padding: 48px;
            text-align: center;
        }

        /* 3. Header & Branding */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-title {
            color: #1e3a8a;
            /* Bold, deep navy blue */
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: #111827;
            /* Dark gray */
            font-size: 0.95rem;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .welcome-title {
            color: #111827;
            /* Bold, dark text */
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        /* 4. Form Elements (Glassy Inputs) */
        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #111827;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            color: #ffffff;
            /* White text */

            /* Semi-transparent white background */
            background: rgba(255, 255, 255, 0.2);
            /* Thin translucent white border */
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            outline: none;

            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        /* Focus state: slightly more opaque white with bright white focus ring */
        .form-control:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* 5. Button & Links */
        .forgot-password {
            text-align: right;
            margin-bottom: 24px;
        }

        .forgot-password a,
        .signup-link a {
            color: #1e3a8a;
            /* Bold navy blue */
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: color 0.3s;
        }

        .forgot-password a:hover,
        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Sign In Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            /* Rich, dark blue linear gradient (medium blue to deep navy) */
            background: linear-gradient(to bottom, #2563eb, #1e3a8a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            /* Soft shadow to pop off the glass */
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.6);
        }

        .signup-link {
            margin-top: 24px;
            color: #111827;
            /* Dark gray */
            font-size: 0.95rem;
            text-align: center;
            font-weight: 500;
        }

        /* Inline SVG Styling */
        .icon {
            width: 32px;
            height: 32px;
            color: #1e3a8a;
            opacity: 0.8;
        }

        .airplane-icon {
            width: 48px;
            height: 48px;
            opacity: 0.7;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

    <div class="glass-panel">

        <!-- Header & Branding -->
        <div class="brand-header">
            <!-- Compass Icon -->
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>

            <h1 class="brand-title">GlobeTrotter</h1>

            <!-- Airplane Icon -->
            <svg class="airplane-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 3.3c-.2.5.1 1.1.6 1.3l6.5 2.5-3.5 3.5-2.8-.7c-.4-.1-.8.1-1 .5l-.9 1.8c-.2.4.1.9.6 1l4.8 1.4 1.4 4.8c.1.5.6.8 1 .6l1.8-.9c.4-.2.6-.6.5-1l-.7-2.8 3.5-3.5 2.5 6.5c.2.5.8.8 1.3.6l3.3-1.2c.5-.2.8-.6.7-1.1z">
                </path>
            </svg>
        </div>

        <p class="brand-subtitle">Plan your ultimate travel itinerary.</p>

        <div id="auth-alert"
            style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; font-weight: 500; background: rgba(229, 62, 62, 0.2); color: #9b2c2c; border: 1px solid rgba(229, 62, 62, 0.3);">
            Invalid email or password.</div>

        <!-- Login Section -->
        <div id="login-section">
            <h2 class="welcome-title">Welcome Back</h2>

            <!-- Form Elements -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="forgot-password">
                    <a href="javascript:void(0)"
                        onclick="alert('Forgot password flow to be implemented.'); return false;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <p class="signup-link">
                Don't have an account? <a href="javascript:void(0)" id="show-signup">Sign up here</a>
            </p>
        </div>

        <!-- Signup Section -->
        <div id="signup-section" style="display: none;">
            <h2 class="welcome-title">Create Account</h2>

            <!-- Form Elements -->
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" class="form-control" placeholder="traveler99" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 15px;">Sign Up</button>
            </form>

            <p class="signup-link">
                Already have an account? <a href="javascript:void(0)" id="show-login">Sign in here</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('show-signup').addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('signup-section').style.display = 'block';
        });

        document.getElementById('show-login').addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('signup-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        });
    </script>
</body>

</html>
