<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTrotter - User Profile</title>

    <!-- Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* 1. Background */
        body {
            /* Full-screen sunset over a mountain lake */
            background: url('https://images.unsplash.com/photo-1542224566-6e85f2e6772f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 40px 20px;
            color: #111827;
        }

        /* 2. Expanded Glass Panel */
        .glass-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;

            /* Semi-transparent white gradient */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.35) 100%);

            /* Heavy frosted glass look */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            /* Glossy 3D border effect */
            border-top: 2px solid rgba(255, 255, 255, 0.8);
            border-left: 2px solid rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            border-right: 2px solid rgba(255, 255, 255, 0.3);

            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5);

            padding: 40px 48px;
        }

        /* 3. Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 20px;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-title {
            color: #1e3a8a;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .btn-outline {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        /* 4. Profile Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 20px rgba(30, 58, 138, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            position: relative;
        }

        .edit-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e3a8a;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .edit-avatar-btn:hover {
            transform: scale(1.1);
        }

        .profile-info h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .profile-info p {
            color: #111827;
            font-weight: 500;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 5. Profile Content Grid */
        .profile-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 40px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Editable Form */
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #111827;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.5);
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn-primary {
            background: linear-gradient(to bottom, #2563eb, #1e3a8a);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.6);
        }

        /* Travel Stats Panel */
        .stats-panel {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 24px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .stat-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1e3a8a;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
            }

            .glass-container {
                padding: 32px 24px;
            }
        }

        /* Icons */
        .icon {
            width: 24px;
            height: 24px;
            color: #1e3a8a;
        }

        .icon-sm {
            width: 16px;
            height: 16px;
            color: currentColor;
        }
    </style>
</head>

<body>

    <div class="glass-container">

        <!-- Header -->
        <header>
            <a href="dashboard.html" class="brand">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span class="brand-title">GlobeTrotter</span>
            </a>
            <a href="dashboard.html" class="btn-outline">Back to Dashboard</a>
        </header>

        <!-- Profile Identity -->
        <div class="profile-header">
            <div class="profile-avatar">
                HM
                <button class="edit-avatar-btn" title="Change Photo">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
            </div>
            <div class="profile-info">
                <h1>Harsh Mehta</h1>
                <p>
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Ahmedabad, Gujarat, India
                </p>
                <p style="margin-top: 4px; font-size: 0.9rem;">B.Tech IT Student @ Silver Oak University | Full-Stack
                    MERN Developer</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="profile-grid">

            <!-- Left Column: Edit Form -->
            <div>
                <h2 class="section-title">Personal Information</h2>
                <form onsubmit="event.preventDefault(); alert('Profile Updated!');">

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" class="form-control" value="Harsh">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" class="form-control" value="Mehta">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label>Email Address</label>
                        <input type="email" class="form-control" value="harsh.mehta@example.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Preferred Currency</label>
                            <select class="form-control">
                                <option value="INR" selected>INR (₹) - Indian Rupee</option>
                                <option value="USD">USD ($) - US Dollar</option>
                                <option value="EUR">EUR (€) - Euro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Language</label>
                            <select class="form-control">
                                <option value="EN" selected>English</option>
                                <option value="GU">Gujarati</option>
                                <option value="HI">Hindi</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Save Changes</button>
                </form>
            </div>

            <!-- Right Column: Travel Stats -->
            <div>
                <h2 class="section-title">Travel Statistics</h2>

                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 3.3c-.2.5.1 1.1.6 1.3l6.5 2.5-3.5 3.5-2.8-.7c-.4-.1-.8.1-1 .5l-.9 1.8c-.2.4.1.9.6 1l4.8 1.4 1.4 4.8c.1.5.6.8 1 .6l1.8-.9c.4-.2.6-.6.5-1l-.7-2.8 3.5-3.5 2.5 6.5c.2.5.8.8 1.3.6l3.3-1.2c.5-.2.8-.6.7-1.1z">
                                </path>
                            </svg>
                            Total Trips Planned
                        </span>
                        <span class="stat-value" id="stat-trips-planned">...</span>
                    </div>

                    <div class="stat-item">
                        <span class="stat-label">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            Total Travel Days
                        </span>
                        <span class="stat-value" id="stat-travel-days">...</span>
                    </div>

                    <div class="stat-item">
                        <span class="stat-label">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                            </svg>
                            Locations Explored
                        </span>
                        <span class="stat-value" id="stat-locations">...</span>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.3);">
                    <a href="javascript:void(0)"
                        style="color: #e11d48; text-decoration: none; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;"
                        onclick="alert('Account deletion not implemented yet.'); return false;">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Delete Account Permanently
                    </a>
                </div>
            </div>

        </div> <!-- End Grid -->

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dom.js"></script>
    <script src="../js/profile.js"></script>

</body>

</html>
